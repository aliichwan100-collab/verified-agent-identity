name: Verify Human Identity 
  
  on: 
  workflow_dispatch: 
     inputs: 
       agent_name: 
         description: 'aliichwan100-collab' 
         required: true 
         default: 'aliichwan100-collab' 
       agent_description: 
         description: 'aliichwan100-collab' 
         required: true 
         default: 'aliichwan100-collab AI Agent' 
  
 jobs: 
   verify: 
     runs-on: ubuntu-latest 
  
     steps: 
       - name: Checkout repo 
         uses: actions/checkout@v3 
  
       - name: Setup Node.js 
         uses: actions/setup-node@v3 
         with: 
           node-version: '20' 
  
       - name: Step 1 - Install aliichwan100-collabHub skill 
         run: npx aliichwan100-collabhub@latest install verified-agent-identity 
  
       - name: Install script dependencies 
         run: | 
           cd scripts 
           npm install 
  
       - name: Step 2 - Create new Ethereum Identity 
         run: node scripts/createNewEthereumIdentity.js 
  
       - name: Step 3 - Link Human to Agent 
         run: | 
           node scripts/manualLinkHumanToAgent.js --challenge '{"name": "aliichwan100-collab", "description": "aliichwan100-collab AI Agent"}'
